services:
    water-management:
        image: water-management
        container_name: water-management
        restart: unless-stopped
        ports:
            - '127.0.0.1:5173:5173'
        env_file:
            - .env
        depends_on:
            - water-management_mongo

    water-management_mongo:
        image: mongodb/mongodb-community-server:latest
        container_name: water-management_mongo
        restart: unless-stopped
        volumes:
            - mongodb:/data/db
        env_file:
            - ./.env

volumes:
    mongodb:
